<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Persamaan Dasar Akuntansi</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f4f8; margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { background-color: white; padding: 40px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); max-width: 600px; width: 90%; }
        h1 { color: #2c3e50; text-align: center; }
        .rumus { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 20px; border-radius: 10px; text-align: center; font-size: 24px; font-weight: bold; margin: 20px 0; }
        ul { line-height: 1.8; color: #34495e; font-size: 16px; }
        .btn { display: block; width: 100%; text-align: center; background-color: #3498db; color: white; padding: 15px; text-decoration: none; border-radius: 8px; font-weight: bold; margin-top: 20px; transition: 0.3s; box-sizing: border-box;}
        .btn:hover { background-color: #2980b9; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Persamaan Dasar Akuntansi</h1>
        <p style="text-align: center; color: #7f8c8d;">Memahami prinsip dasar pencatatan keuangan perusahaan.</p>
        
        <div class="rumus">HARTA = UTANG + MODAL</div>
        
        <ul>
            <li><b>Harta (Aset):</b> Kekayaan yang dimiliki (Kas, Gedung, Peralatan).</li>
            <li><b>Utang (Kewajiban):</b> Tanggung jawab kepada pihak luar.</li>
            <li><b>Modal (Ekuitas):</b> Hak milik dari pemilik perusahaan.</li>
        </ul>
        
        <a href="#" class="btn">Mulai Belajar</a>
    </div>
</body>
</html>
